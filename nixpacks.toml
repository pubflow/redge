[variables]
CGO_ENABLED = "0"
GOFLAGS = "-buildvcs=false"

[phases.setup]
nixPkgs = ["go_1_25"]

[phases.install]
cmds = ["go mod download"]

[phases.build]
cmds = ["go build -trimpath -ldflags '-s -w' -o /app/bin/redge ./cmd/redge"]

[start]
cmd = "sh -c 'export REDGE_HTTP_ADDR=${REDGE_HTTP_ADDR:-0.0.0.0:${PORT:-8080}}; if [ -n \"${ADMIN_PORT:-}\" ]; then export REDGE_ADMIN_ADDR=0.0.0.0:${ADMIN_PORT}; fi; exec /app/bin/redge'"
